services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        APP_BASE_URL: /status
    depends_on:
      - mongo
    environment:
      - MONGODB_URI=mongodb://mongo:27017/monit
      - JWT_SECRET=${JWT_SECRET:-super-secret-change-me}
      - DEFAULT_ORG_ID=${DEFAULT_ORG_ID:-default}
      - APP_BASE_URL=/status
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # Optional: MongoDB Express for debugging
  mongo-express:
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
