services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - mongo
    environment:
      - MONGODB_URI=mongodb://mongo:27017/monit
      - JWT_SECRET=${JWT_SECRET:-super-secret-change-me}
      - DEFAULT_ORG_ID=${DEFAULT_ORG_ID:-default}
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # Optional: MongoDB Express for debugging
  mongo-express:
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo-data:
